<style>
:root{
  --red:#B5152B; --red2:#E13A42; --blue:#172A63; --blue2:#244AA5; --violet:#6B2C75;
  --ink:#F9F1EA; --paper:#FFF9F3; --marigold:#FFC928; --taxi-ink:#1A1B22;
  --serif:'Young Serif', Georgia, 'Times New Roman', serif;
  --sans:'Hind Siliguri', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh; min-height:100svh; overflow-x:hidden;
  font-family:var(--sans); color:var(--ink); line-height:1.5;
  background:
    radial-gradient(90% 55% at 78% 18%, rgba(225,58,66,.30), transparent 65%),
    radial-gradient(80% 60% at 15% 78%, rgba(36,74,165,.38), transparent 68%),
    linear-gradient(145deg,var(--blue) 0%,var(--blue2) 34%,var(--violet) 62%,var(--red) 100%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:6px}

/* ---------- Stage 1: map ---------- */
#stage-map{
  min-height:100vh; min-height:100svh; display:flex; flex-direction:column; align-items:center;
  padding:clamp(18px,3.5vh,36px) 16px 18px; transition:opacity .6s ease, transform .6s ease;
}
#stage-map.out{opacity:0;transform:translateY(-10px);pointer-events:none}
.intro{text-align:center;max-width:34rem}

.intro p{margin-top:.5rem;font-size:clamp(1rem,2.6vw,1.15rem);opacity:.85}
.mapwrap{flex:1;width:100%;max-width:900px;position:relative;min-height:340px;margin:6px 0}
#map{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation}
body.zoomed .mapwrap{-webkit-mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 80%,transparent 100%);mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 80%,transparent 100%)}
@media (max-width:600px){.mapwrap{min-height:420px}}
#land{fill:url(#dots);stroke:url(#mapStroke);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;filter:drop-shadow(0 20px 30px rgba(10,16,48,.30));transition:filter .2s}
#land-base{fill:rgba(255,255,255,.06)}
#landg:hover #land{filter:drop-shadow(0 20px 30px rgba(10,16,48,.30)) brightness(1.08) saturate(1.15)}
.pin{cursor:pointer}
.pin .dot{fill:#214EA3;stroke:#fff;stroke-width:3.5;filter:drop-shadow(0 4px 8px rgba(0,0,0,.28))}
.pin .lbl{font-family:var(--sans);font-weight:600;font-size:27px;fill:#fff;paint-order:stroke;stroke:#142454;stroke-width:5px;stroke-linejoin:round;letter-spacing:.01em}
.pin:hover .dot,.pin:focus-visible .dot{fill:var(--red2)}
.pin.bal .dot{fill:#D84947}
.pin.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0}to{opacity:1}}
.pin.dim{opacity:.22;transition:opacity .5s}
#kol .core{fill:var(--red2);stroke:#fff;stroke-width:3}
#kol .ring{fill:none;stroke:#FFC928;stroke-width:2.3;opacity:.65;transform-box:fill-box;transform-origin:center;animation:beacon 2.4s ease-out infinite}
#kol .ring.r2{animation-delay:1.2s}
@keyframes beacon{from{transform:scale(1);opacity:.6}to{transform:scale(3.4);opacity:0}}
#kol .lbl{font-family:var(--serif);font-size:31px;font-style:normal;fill:#FFC928;stroke:#4A1D40}
.you .dot{fill:#fff;stroke:var(--red2);stroke-width:4}
.you .lbl{font-weight:600}

.actions-row{display:flex;justify-content:center;margin-top:4px}
.chip{
  border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.10);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:#fff;border-radius:999px;padding:9px 18px;font-size:.96rem;font-weight:600;transition:background .15s,border-color .15s,transform .15s
}
.chip:hover{background:rgba(255,255,255,.20);border-color:#fff;transform:translateY(-1px)}
.hint{margin-top:10px;font-size:.92rem;opacity:.78;text-align:center}
#skip{
  position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));
  background:rgba(20,28,73,.72);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);border-radius:999px;padding:7px 14px;font-size:.9rem;
  opacity:0;pointer-events:none;transition:opacity .3s
}
body.travelling #skip{opacity:1;pointer-events:auto}
body.travelling .actions-row,body.travelling .hint{opacity:.25;pointer-events:none;transition:opacity .4s}
body.travelling .intro{opacity:.35;transition:opacity .4s}

/* ---------- Stage 2: Kolkata taxi drive ---------- */
#stage-drive{display:none;position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:#10224f;isolation:isolate}
#stage-drive.show{display:block}

.far-city{bottom:18%;height:42%;z-index:1;opacity:.30;filter:blur(.35px)}

.far-city span:nth-child(1){left:3%;height:52%}.far-city span:nth-child(2){left:10%;height:74%}.far-city span:nth-child(3){left:18%;height:44%}.far-city span:nth-child(4){left:26%;height:68%}.far-city span:nth-child(5){left:35%;height:58%}.far-city span:nth-child(6){left:44%;height:82%}.far-city span:nth-child(7){left:55%;height:51%}.far-city span:nth-child(8){left:64%;height:72%}.far-city span:nth-child(9){left:73%;height:47%}.far-city span:nth-child(10){left:82%;height:64%}.far-city span:nth-child(11){left:91%;height:55%}
.far-city span::after{content:"";position:absolute;inset:12% 15%;background:repeating-linear-gradient(90deg,rgba(255,231,177,.35) 0 5px,transparent 5px 12px);opacity:.45}
.landmark{position:absolute;bottom:0;color:rgba(43,47,74,.72);will-change:transform;filter:drop-shadow(0 16px 18px rgba(29,31,54,.16))}
.landmark svg{display:block;width:100%;height:auto}
#howrah{left:1%;width:min(48vw,620px);bottom:7%;z-index:2}
#victoria{left:43%;width:min(24vw,300px);bottom:6%;z-index:3}
#jadavpur{right:-1%;width:min(29vw,360px);bottom:4%;z-index:2}
.landmark .label{display:none}
.mid-city{bottom:17%;height:42%;z-index:4;opacity:.72}
.mid-city span{position:absolute;bottom:0;width:clamp(46px,8vw,110px);background:linear-gradient(180deg,#b8665e,#8c4c55);border-radius:5px 5px 0 0;box-shadow:inset 0 0 0 1px rgba(255,230,200,.13)}
.mid-city span:nth-child(1){left:2%;height:68%}.mid-city span:nth-child(2){left:13%;height:83%}.mid-city span:nth-child(3){left:24%;height:57%}.mid-city span:nth-child(4){left:33%;height:76%}.mid-city span:nth-child(5){left:45%;height:61%}.mid-city span:nth-child(6){left:56%;height:88%}.mid-city span:nth-child(7){left:69%;height:64%}.mid-city span:nth-child(8){left:80%;height:79%}.mid-city span:nth-child(9){left:92%;height:54%}
.mid-city span::before{content:"";position:absolute;inset:10% 12%;background:repeating-linear-gradient(90deg,rgba(255,222,171,.6) 0 7px,transparent 7px 23px),repeating-linear-gradient(180deg,transparent 0 14px,rgba(255,222,171,.35) 14px 20px,transparent 20px 34px);opacity:.46}
.mid-city span::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:9%;background:rgba(63,43,54,.5);border-radius:3px 3px 0 0}
.heritage-arch{position:absolute;left:47%;bottom:0;width:15%;height:22%;z-index:5;border:8px solid rgba(65,45,62,.72);border-bottom:0;border-radius:60% 60% 0 0;box-shadow:0 -2px 0 rgba(255,229,189,.18)}
.heritage-arch::after{content:"";position:absolute;left:20%;right:20%;top:18%;bottom:0;border:3px solid rgba(255,221,169,.25);border-bottom:0;border-radius:50% 50% 0 0}
.drive-road{position:absolute;left:-15%;right:-15%;bottom:-4%;height:43%;z-index:6;background:linear-gradient(90deg,rgba(12,16,27,.95),rgba(35,38,48,.98) 38%,rgba(17,21,31,.98) 62%,rgba(11,14,24,.95));clip-path:polygon(17% 0,83% 0,100% 100%,0 100%);box-shadow:inset 0 2px rgba(255,255,255,.12),0 -24px 60px rgba(20,18,36,.2)}
.road-perspective{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.lane{position:absolute;top:23%;left:50%;width:5px;height:34%;background:repeating-linear-gradient(180deg,#f8f1dc 0 34px,transparent 34px 74px);transform:translateX(-50%) perspective(300px) rotateX(52deg);transform-origin:50% 0;opacity:.8}
.lane.l2{left:36%;opacity:.36}.lane.l3{left:64%;opacity:.36}
.edge-line{position:absolute;top:19%;width:2px;height:88%;background:rgba(255,202,89,.52);transform-origin:top}.edge-line.l{left:20%;transform:rotate(8deg)}.edge-line.r{right:20%;transform:rotate(-8deg)}
.road-glow{position:absolute;left:50%;bottom:0;width:46%;height:28%;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,190,83,.18),transparent 70%);filter:blur(10px);z-index:8}
.road-lights{position:absolute;inset:0;z-index:8;pointer-events:none}
.lamp{position:absolute;bottom:31%;width:3px;height:22%;background:#2c2a37;border-radius:3px;opacity:.6}.lamp::before{content:"";position:absolute;left:50%;top:-6px;width:13px;height:6px;border-radius:999px;background:#ffe7ae;transform:translateX(-50%);box-shadow:0 0 20px rgba(255,216,138,.8)}
.lamp:nth-child(1){left:15%}.lamp:nth-child(2){left:30%;transform:scale(.72)}.lamp:nth-child(3){right:30%;transform:scale(.72)}.lamp:nth-child(4){right:15%}
.taxi-wrap{position:absolute;left:50%;bottom:8%;width:clamp(255px,32vw,430px);height:clamp(120px,16vw,190px);transform:translateX(-50%);z-index:14;will-change:transform;filter:drop-shadow(0 22px 18px rgba(12,13,22,.35))}
.taxi-car{position:absolute;inset:0}.taxi-shadow{position:absolute;left:8%;right:7%;bottom:0;height:18%;border-radius:50%;background:rgba(8,10,17,.45);filter:blur(8px)}
.taxi-body{position:absolute;left:3%;right:3%;bottom:17%;height:48%;background:linear-gradient(180deg,#ffd94b 0%,#f8c42c 54%,#e9a91b 100%);border:3px solid #1a1b21;border-radius:28px 38px 18px 18px}
.taxi-roof{position:absolute;left:24%;right:22%;top:5%;height:48%;background:linear-gradient(180deg,#f9c52b,#e8aa18);border:3px solid #1a1b21;border-bottom:0;border-radius:65% 65% 8px 8px;clip-path:polygon(16% 0,82% 0,100% 100%,0 100%)}
.taxi-window{position:absolute;top:13%;height:35%;z-index:3;background:linear-gradient(180deg,rgba(35,55,69,.88),rgba(72,82,83,.7));border:2px solid #191a20}.taxi-window.w1{left:29%;width:21%;clip-path:polygon(24% 0,100% 0,100% 100%,0 100%)}.taxi-window.w2{left:51%;width:22%;clip-path:polygon(0 0,77% 0,100% 100%,0 100%)}.taxi-window::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 42%)}
.driver-silhouette{position:absolute;left:56%;top:18%;width:12%;height:28%;z-index:4;opacity:.34;background:#17191f;border-radius:50% 50% 35% 35%}.driver-silhouette::after{content:"";position:absolute;left:-18%;right:-18%;bottom:-34%;height:52%;background:#17191f;border-radius:45% 45% 18% 18%}
.taxi-stripe{position:absolute;left:4%;right:4%;bottom:39%;height:11%;background:#16609b;border-top:2px solid rgba(255,255,255,.45);border-bottom:2px solid rgba(11,45,72,.7);z-index:5}
.taxi-chrome{position:absolute;left:4%;right:4%;bottom:27%;height:3px;background:rgba(255,255,255,.62);z-index:5}
.wheel{position:absolute;bottom:1%;width:23%;aspect-ratio:1;border-radius:50%;background:#17191f;border:5px solid #0a0b10;z-index:6;box-shadow:inset 0 0 0 5px #4e5057,inset 0 0 0 10px #b7b9ba}.wheel::after{content:"";position:absolute;inset:39%;border-radius:50%;background:#56595f}.wheel.wl{left:13%}.wheel.wr{right:12%}
.taxi-headlamp{position:absolute;right:2%;bottom:31%;width:7%;height:11%;border-radius:50%;background:#fff8cf;box-shadow:0 0 22px rgba(255,241,175,.9);z-index:6}
.taxi-bumper{position:absolute;right:0;bottom:18%;width:7%;height:9%;border-radius:0 8px 8px 0;background:#c5c8c9;border:2px solid #72767a;z-index:6}
.taxi-sign{position:absolute;top:0;left:46%;width:13%;height:13%;border-radius:5px 5px 2px 2px;background:#f8f2d4;border:2px solid #1a1b21;z-index:7}
.drive-vignette{position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(ellipse at center,transparent 46%,rgba(8,15,36,.18) 100%)}
@media (max-width:700px){.drive-sky{inset:0 0 34%}.far-city{bottom:18%;height:38%}.mid-city{bottom:19%;height:36%}#howrah{left:-22%;width:82vw;bottom:10%}#victoria{left:46%;width:40vw;bottom:9%}#jadavpur{right:-18%;width:48vw;bottom:7%}.drive-road{height:40%}.taxi-wrap{width:min(88vw,360px);height:min(34vw,155px);bottom:7%}.lane{top:20%;height:40%}.edge-line.l{left:14%}.edge-line.r{right:14%}}
/* reveal floats over the same Kolkata scene */
.final-reveal{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:22px;pointer-events:none;opacity:0;transition:opacity .9s ease;background:linear-gradient(180deg,rgba(13,26,70,.13),rgba(33,16,47,.58))}
#stage-drive.revealed .final-reveal{opacity:1;pointer-events:auto}
#stage-drive.revealed .drive-caption{opacity:0;transition:opacity .4s ease}
.reveal-card{width:min(92vw,720px);text-align:center;transform:translateY(26px) scale(.98);transition:transform 1s cubic-bezier(.2,.8,.2,1);color:#fff}
#stage-drive.revealed .reveal-card{transform:none}
.couple-photo{width:min(76vw,390px);margin:0 auto 18px;position:relative}
.couple-photo .frame{aspect-ratio:4/3;border-radius:24px;overflow:hidden;border:2px solid rgba(255,255,255,.75);box-shadow:0 24px 60px rgba(4,8,30,.40);background:#ddd;transform:rotate(-1deg)}
.couple-photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 72%}
.couple-photo::after{content:"KOLKATA • 2027";position:absolute;right:-7px;bottom:-8px;background:var(--marigold);color:#2a1b22;border-radius:999px;padding:7px 12px;font-size:.72rem;font-weight:800;letter-spacing:.08em;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.bn{font-size:1.1rem;font-weight:600;color:#ffd46b;letter-spacing:.08em}.names{font-family:var(--serif);font-weight:400;font-size:clamp(2.45rem,8vw,4.3rem);line-height:.98;margin:4px 0 8px}.save{font-size:clamp(.9rem,2vw,1.05rem);text-transform:uppercase;letter-spacing:.22em;opacity:.82}.date{font-family:var(--serif);font-size:clamp(1.65rem,5vw,2.7rem);margin-top:7px}.place{font-size:1.05rem;opacity:.9}.guest-line{margin-top:7px;font-size:.95rem;opacity:.82}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;justify-content:center}.btn{border-radius:999px;padding:10px 18px;border:1px solid rgba(255,255,255,.6);font-weight:700;background:rgba(255,255,255,.10);color:#fff;backdrop-filter:blur(9px)}.btn.primary{background:#fff;color:#26336d;border-color:#fff}.again{display:block;margin:12px auto 0;background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:4px;opacity:.78;font-size:.92rem}

@media (max-width:700px){
  #howrah{left:-12%;width:72vw;bottom:15%}#victoria{left:48%;width:36vw;bottom:9%}#jadavpur{right:-10%;width:42vw;bottom:6%}.landmark .label{display:none}
  .drive-road{height:35%}.taxi-wrap{bottom:6%}.drive-sky{inset:0 0 26%}.couple-photo{width:min(80vw,350px)}
}
@media (prefers-reduced-motion:reduce){
  #kol .ring{animation:none}
  #stage-map,.final-reveal,.reveal-card{transition:none}
}
</style>

<body>

<main id="stage-map" aria-live="polite">
  <header class="intro">
    <h1>Come find us.</h1>
    <p id="lead">Tap the place you're joining us from and we'll plan your journey to Kolkata.</p>
  </header>

  <div class="mapwrap">
    <svg id="map" role="img" aria-label="Map of India. Tap a city or anywhere on the map to start your journey to Kolkata.">

        <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
          <rect width="14" height="14" fill="#F7F2F4"/>
          <circle cx="7" cy="7" r="1.45" fill="#C54A67" opacity=".65"/>

      </defs>
      <g id="landg"><path id="land" d=""/></g>

  <div class="drive-scene">

        <div class="landmark" id="howrah"><svg viewBox="0 0 620 220" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M20 185H600" stroke-width="8"/><path d="M45 185L110 48L175 185M445 185L510 48L575 185" stroke-width="12"/><path d="M110 48H510" stroke-width="11"/><path d="M110 70H510M110 101H510M110 132H510M110 162H510" stroke-width="5" opacity=".8"/><path d="M110 48L175 185M175 48L110 185M175 48L240 185M240 48L175 185M240 48L305 185M305 48L240 185M305 48L370 185M370 48L305 185M370 48L435 185M435 48L370 185M435 48L510 185M510 48L435 185" stroke-width="4" opacity=".9"/><path d="M110 48L175 101L240 48L305 101L370 48L435 101L510 48" stroke-width="4"/></g></svg></div>
        <div class="landmark" id="victoria"><svg viewBox="0 0 300 240" aria-hidden="true"><g fill="currentColor"><rect x="28" y="145" width="244" height="60" rx="3"/><rect x="45" y="119" width="210" height="32"/><path d="M55 119Q150 47 245 119Z"/><ellipse cx="150" cy="74" rx="25" ry="29"/><path d="M150 17L159 47H141Z"/><rect x="62" y="150" width="14" height="55"/><rect x="104" y="150" width="14" height="55"/><rect x="142" y="150" width="16" height="55"/><rect x="180" y="150" width="14" height="55"/><rect x="224" y="150" width="14" height="55"/></g></svg></div>
        <div class="landmark" id="jadavpur"><svg viewBox="0 0 360 210" aria-hidden="true"><g fill="currentColor"><rect x="24" y="92" width="312" height="88" rx="4"/><rect x="82" y="68" width="196" height="112"/><path d="M70 68H290L276 47H84Z"/><rect x="158" y="28" width="44" height="40"/><rect x="46" y="112" width="34" height="38"/><rect x="280" y="112" width="34" height="38"/><path d="M128 180V121Q128 103 180 103Q232 103 232 121V180Z" fill="rgba(35,38,58,.32)"/></g></svg></div>
        <div class="heritage-arch"></div>
      </div>

function fitBox(minx,miny,maxx,maxy,pad){
  const r = svg.getBoundingClientRect(); const aspect = r.width / Math.max(r.height,1);
  let w = Math.max((maxx-minx)*pad, 200), h = Math.max((maxy-miny)*pad, 200);
  if(w/h < aspect) w = h*aspect; else h = w/aspect;
  if(w > FULL.w){ w = FULL.w; h = w/aspect; }
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  return {x:cx-w/2, y:cy-h/2, w, h};
}

const rad = d=>d*Math.PI/180;
function km(a,b,c,d){ const R=6371, dl=rad(c-a), dn=rad(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function unproject(x,y){ return [D.LAT0 - y/D.K, x/(D.C*D.K) + D.LON0]; }
function nearestName(lat,lon){
  let best=null, bd=1e9;
  for(const k in D.cities){
    const d=km(lat,lon,D.cities[k][2],D.cities[k][3]);
    if(d<bd){bd=d;best=k;}

  return bd<110 ? best : null;
}

function smooth(pts){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function arc(s,e,bend){
  const dx=e[0]-s[0], dy=e[1]-s[1], dist=Math.hypot(dx,dy)||1;
  let nx=-dy/dist, ny=dx/dist; if(ny>0){nx=-nx;ny=-ny;}
  const c=[(s[0]+e[0])/2+nx*dist*bend,(s[1]+e[1])/2+ny*dist*bend];
  return `M${s[0]},${s[1]} Q${c[0]},${c[1]} ${e[0]},${e[1]}`;
}

  kol.querySelectorAll('.ring,.core').forEach(x=>x.style.opacity='0'); kt.style.opacity='0';
  const g=mk('g',{class:'kol-taxi',transform:'translate(-2 -4) scale(.78)'},kol);
  mk('rect',{x:-19,y:-10,width:38,height:20,rx:6,fill:'#FFC928',stroke:'#171821','stroke-width':2},g);
  mk('path',{d:'M-10 -10 L-4 -20 H10 L16 -10 Z',fill:'#FFC928',stroke:'#171821','stroke-width':2},g);
  mk('rect',{x:-2,y:-17,width:10,height:7,rx:1,fill:'#D9F0F5',stroke:'#171821','stroke-width':1},g);
  mk('path',{d:'M-17 -2 H17',stroke:'#171821','stroke-width':4,'stroke-dasharray':'5 4'},g);
  mk('circle',{cx:-11,cy:10,r:5,fill:'#171821'},g); mk('circle',{cx:11,cy:10,r:5,fill:'#171821'},g);
  return g;
}
async function startAtKolkata(){
  if(state.busy) return; state.busy=true; state.skip=false; state.kind='taxi'; state.from='Kolkata';
  document.body.classList.add('travelling');
  const t=mapTaxiIcon();
  if(!REDUCED) t.animate([{transform:'translate(-2px,-4px) scale(.58)',opacity:.2},{transform:'translate(-2px,-4px) scale(1.05)',opacity:1},{transform:'translate(-2px,-4px) scale(.78)',opacity:1}],{duration:650,easing:'cubic-bezier(.2,.9,.2,1)'});
  await wait(700); enterDrive();
}
/* ---------- journey ---------- */
async function begin(target){
  if(state.busy) return; state.busy=true; state.skip=false;
  document.body.classList.add('travelling'); fx.innerHTML='';
  let kind='flight', from, name=null, hub=null;
  if(target==='Abroad'){ from=[-170,150]; name='Abroad'; }
  else if(typeof target==='string'){ hub=target; from=[D.cities[hub][0],D.cities[hub][1]]; name=hub; if(hub==='Balurghat') kind='train'; }
  else {
    from=[target.x,target.y]; const [lat,lon]=unproject(...from);
    const dB=km(lat,lon,D.cities.Balurghat[2],D.cities.Balurghat[3]), dK=km(lat,lon,D.cities.Kolkata[2],D.cities.Kolkata[3]);
    name = nearestName(lat,lon);
    if(dB<70){kind='train'; name='Balurghat'; from=[D.cities.Balurghat[0],D.cities.Balurghat[1]];}
    else if(dK<250){kind='taxi'; if(dK<40) name='Kolkata';}
  }
  state.kind=kind; state.from=name||'Your city';
  pinEls.forEach(p=>{ const keep = p.dataset.name===hub || (kind==='train'&&p.dataset.name==='Balurghat'); p.classList.toggle('dim',!keep); });

  // path
  let d;
  if(kind==='train'){ d=smooth(D.rail); }
  else if(kind==='taxi'){ d=arc(from,[K[0],K[1]],.12); }
  else d=arc(from,[K[0],K[1]], target==='Abroad'?.22:.26);
  const probe=mk('path',{d,fill:'none'},fx); const len=probe.getTotalLength();

  // camera
  const bb=probe.getBBox();
  const abroad = target==='Abroad';
  const cam = abroad ? fullBox() : fitBox(bb.x,bb.y,bb.x+bb.width,bb.y+bb.height,1.7);
  document.body.classList.toggle('zoomed', !abroad);
  await tweenVB(cam, 1100);
  const z = zoomOf(VB);

  // guest origin marker for tapped points
  if(typeof target!=='string' && kind!=='train'){
    const y=mk('g',{class:'pin you',transform:`translate(${from[0]} ${from[1]}) scale(${z})`},fx);
    mk('circle',{class:'dot',r:9},y);
  }

  // guide + trail
  let trail;
  if(kind==='train'){
    mk('path',{d,fill:'none',stroke:'#7a4b2c','stroke-width':5*z,'stroke-linecap':'round',opacity:.45},fx);
    mk('path',{d,fill:'none',stroke:'#F5F1F3','stroke-width':4*z,'stroke-dasharray':`${2.2*z} ${7*z}`,opacity:.95},fx);
    trail=mk('path',{d,fill:'none',stroke:'#E13A42','stroke-width':2.2*z,'stroke-linecap':'round'},fx);
  } else {
    mk('path',{d,fill:'none',stroke:'#E13A42','stroke-width':3*z,'stroke-linecap':'round','stroke-dasharray':`0.1 ${9*z}`,opacity:.55},fx);
    trail=mk('path',{d,fill:'none',stroke:'#E13A42','stroke-width':2.4*z,'stroke-linecap':'round',opacity:.9},fx);
  }
  trail.setAttribute('stroke-dasharray',len); trail.setAttribute('stroke-dashoffset',len);

  const veh = kind==='train'?trainVehicle(): kind==='taxi'?taxiVehicle():planeVehicle();
  const s = 2.3*z;
  const dur = kind==='train'?7000: kind==='taxi'?3200: (abroad?4200:3800);

  function place(p){
    const L=p*len;
    const at=l=>probe.getPointAtLength(Math.max(0,Math.min(len,l)));
    if(kind==='train'){
      veh.cars.forEach((g,i)=>{ const l=L-i*veh.gap*s; const a=at(l), b=at(l+2); const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
        g.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${ang}) scale(${s*.8})`); g.style.opacity = l<-2?0:1; });
    } else {
      const a=at(L), b=at(L+2); const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      veh.update(a,ang,s,p);
    }
    trail.setAttribute('stroke-dashoffset',len*(1-p));
  }
  place(0);
  await wait(250);
  await new Promise(res=>{
    if(REDUCED||state.skip){ place(1); return res(); }
    const t0=performance.now();
    (function step(now){
      if(state.skip){ place(1); return res(); }
      const t=Math.min(1,(now-t0)/dur); place(ease(t)); t<1?requestAnimationFrame(step):res();
    })(t0);
  });

  // arrival
  veh.remove && veh.remove();
  if(!REDUCED && !state.skip){
    for(let i=0;i<2;i++){
      const r=mk('circle',{cx:K[0],cy:K[1],r:8*z,fill:'none',stroke:'#E13A42','stroke-width':3*z,opacity:.8},fx);
      r.animate([{transform:'scale(1)',opacity:.8},{transform:'scale(5)',opacity:0}],{duration:1100,delay:i*350,easing:'ease-out'}).onfinish=()=>r.remove();
      r.style.transformBox='fill-box'; r.style.transformOrigin='center';
    }
    await wait(1200);
  }
  const taxi=mapTaxiIcon();
  if(!REDUCED && !state.skip){ taxi.animate([{transform:'translate(-2px,-4px) scale(.55)',opacity:.3},{transform:'translate(-2px,-4px) scale(1.05)',opacity:1},{transform:'translate(-2px,-4px) scale(.78)',opacity:1}],{duration:650,easing:'cubic-bezier(.2,.9,.2,1)'}); await wait(720); }
  enterDrive();
}

/* ---------- Kolkata drive + reveal ---------- */
function enterDrive(){
  const sm=$('#stage-map'), sd=$('#stage-drive');
  sm.classList.add('out'); document.body.classList.remove('travelling','zoomed');
  setTimeout(()=>{
    sm.style.display='none'; sd.classList.add('show'); scrollTo(0,0);
    runDrive();
  }, REDUCED?0:460);
}
function runDrive(){
  const sd=$('#stage-drive'), taxi=$('#drive-taxi'), how=$('#howrah'), vic=$('#victoria'), jad=$('#jadavpur');
  sd.classList.remove('revealed');
  [how,vic,jad].forEach(x=>x.style.transform='');
  taxi.style.transform='translateX(-50%) scale(.94)';
  if(REDUCED||state.skip){ finishDrive(); return; }
  const duration=5200, t0=performance.now();
  const far=document.querySelector('.far-city'), mid=document.querySelector('.mid-city');
  function frame(now){
    const t=Math.min(1,(now-t0)/duration), e=t*t*(3-2*t);
    const drift=22*e, near=54*e, bob=Math.sin(t*Math.PI*8)*1.7*(1-t);
    taxi.style.transform=`translateX(calc(-50% + ${Math.sin(t*Math.PI*2)*3}px)) translateY(${bob}px) scale(${.94+.06*e})`;
    how.style.transform=`translate3d(${-drift}px,0,0)`;
    vic.style.transform=`translate3d(${-near}px,0,0) scale(${1+.035*e})`;
    jad.style.transform=`translate3d(${-drift*.62}px,0,0)`;
    far.style.transform=`translate3d(${-drift*.22}px,0,0)`;
    mid.style.transform=`translate3d(${-drift*.58}px,0,0)`;
    if(t<1) requestAnimationFrame(frame); else finishDrive();
  }
  requestAnimationFrame(frame);
}
function finishDrive(){
  const sd=$('#stage-drive'), taxi=$('#drive-taxi');
  taxi.style.transition='transform .8s cubic-bezier(.2,.85,.25,1)';
  taxi.style.transform='translateX(-50%) translateY(0) scale(.98)';
  setTimeout(()=>sd.classList.add('revealed'), REDUCED?0:700);
}
$('#skip').addEventListener('click',()=>{ state.skip=true; });

/* ---------- actions ---------- */
$('#btn-again').addEventListener('click',()=>{
  const sm=$('#stage-map'), sd=$('#stage-drive');
  sd.classList.remove('revealed','show'); sm.style.display=''; fx.innerHTML='';
  const mt=kol.querySelector('.kol-taxi'); if(mt) mt.remove();
  kol.querySelectorAll('.ring,.core').forEach(x=>x.style.opacity=''); kt.style.opacity='';
  pinEls.forEach(p=>p.classList.remove('dim')); setVB(fullBox()); scrollTo(0,0);
  $('#drive-taxi').style.transition=''; $('#drive-taxi').style.transform='translateX(-50%)';
  requestAnimationFrame(()=>{ sm.classList.remove('out'); state.busy=false; state.skip=false; });
});
